# Builds and publishes the APK whenever a version tag (v1.0, v1.1, ...) is
# pushed: the JVM unit tests gate the build, then the release APK is attached
# to the GitHub release for that tag.
#
# The release build is debug-signed on purpose (see app/build.gradle.kts):
# this is a sideloaded personal tool, and a keystore-less build installs
# straight from `adb install`. The GitHub runner generates its own debug
# keystore, so a CI release is signed with a DIFFERENT key than your local
# builds; switching between the two on a phone needs one uninstall.
name: Release APK

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ANDROID_HOME is preinstalled on the ubuntu runners; the Android Gradle
      # plugin downloads the platform and build-tools it needs.
      - name: Unit tests
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest

      - name: Build release APK
        run: ./gradlew --no-daemon assembleRelease

      - name: Name the APK after the tag
        run: cp app/build/outputs/apk/release/app-release.apk "SolarMonitor-${GITHUB_REF_NAME#v}.apk"

      - name: Attach APK to the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: SolarMonitor-*.apk
          generate_release_notes: true
